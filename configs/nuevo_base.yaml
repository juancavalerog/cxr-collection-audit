# Protocolo nuevo para las líneas base reentrenadas (ERM y control de fuente). docs/03_arquitectura.md,
# Sections 2.1 y 2.8, y PLAN.md, Section 12.3: partición limpia, preprocesado homogéneo P1 a P6, selección en la
# validación robusta (bimcv de val) por AUC-ROC, inicialización ImageNet de timm (NIH queda como sensibilidad).
experiment: nuevo_base
precision: auto
deterministic: true
data:
  mode: limpia             # split_clean sin excluidas: 67 932 / 7 664 / 8 479
  train_sources: null
  channel: homogeneo       # P1 a P6, caché PNG de 8 bits, [0, 1]
  res: 224
  cache: auto              # data/cache/covidx_cxr4/homogeneo_224
  num_workers: 12
  eval_batch_size: 256
  eval_sets: [val, test, val_robust]
model:
  name: paper1_convnext    # misma cabeza que el artículo 1 para aislar el efecto del protocolo
  backbone: convnext_tiny
  init: {type: timm_imagenet, path: null}   # timm convnext_tiny preentrenado (descarga en el servidor)
  input_scale: 1.0         # entrada en [0, 1]; normalización de ImageNet dentro del modelo
  dropout: 0.5
  drop_path_rate: 0.1
  l2_hidden: 0.0           # se usa el decaimiento de AdamW en su lugar
  freeze_backbone_norms: false
  head_init: glorot
train:
  batch_size: 128
  micro_batch: 128
  sampler: exact           # 50/50 exacto por lote
  augment: nuevo           # sin mixup; brillo y contraste por imagen
  augment_params: {rotation: 0.03, zoom: 0.1, brightness: 0.05, contrast: [0.9, 1.1], cutout: 24}
  grad_clip: 1.0
  loss: {name: focal, alpha: 0.5, gamma: 2.0, apply_class_balancing: true, label_smoothing: 0.0}
  optimizer: {name: adamw, weight_decay: 0.05, betas: [0.9, 0.999], eps: 1.0e-8,
              lr_mult: {backbone: 1.0, head: 20.0}, no_decay_norm_bias: true}
  phases:
    - {name: A, epochs: 3, lr: 1.0e-3, warmup_frac: 0.05, min_lr: 1.0e-7, train_backbone: false, ema: false, early_stopping: false}
    - {name: B, epochs: 60, lr: 5.0e-5, warmup_frac: 0.05, min_lr: 1.0e-7, train_backbone: true, ema: true, early_stopping: true}
  log_every: 20
ema: {mode: estandar, momentum: 0.9999}
selection: {metric: auc_roc, subset: val_robust, impl: exact, patience: 10, tta: false, drop_remainder_batch: null}
eval: {tta: true, states: [last, best, ema]}
thermal: {every: 50}

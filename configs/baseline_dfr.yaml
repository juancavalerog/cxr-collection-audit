# Línea base dfr: DFR (reajuste de la última capa en val_robust equilibrada). Referencia: kirichenko2023last. Estado: implementado.
# Deriva de configs/baseline_base.yaml (y esta de configs/nuevo_base.yaml): partición limpia, canal homogeneo con la
# caché común con máscaras (data/cache_m), ConvNeXt-Tiny ImageNet con la cabeza del artículo 1, selección y
# comparación en val_robust_sel, mismo presupuesto. Test BLOQUEADO en piloto y búsqueda; para los experimentos
# finales, ver docs/06_lineas_base.md, Section 4 (protocol.congelado).
# Lanzar: python -m src.baselines.run --config configs/baseline_dfr.yaml --seed 42 [--trial T]
base: baseline_base.yaml
experiment: baseline_dfr
# val_robust completa contiene val_robust_fit (datos del reajuste): no se evalúa por no ser comparable.
data: {eval_sets: [val, val_robust_sel]}
baseline:
  method: dfr
  params: {}            # valores por defecto del registro: {'C_grid': [1.0, 0.7, 0.3, 0.1, 0.07, 0.03, 0.01], 'n_reps': 10, 'states': ['last', 'best', 'ema']}

# Lista cerrada de experimentos, semillas y tablas del aporte C1 (docs/08_evaluacion.md, V2.3; docs/14, Section 2).
# Entra en la congelación del protocolo. La leen scripts/eval/auditoria_covidx.py --c1 y scripts/eval/evaluar_test_b1.py.
metodos: [erm, control_fuente, groupdro, dann, coral, mixstyle, fourier, lisa, dfa_fuente, dfr, erm_mascara, erm_cuotas]
semillas: [42, 123, 2024, 7, 999]
experimento: "baseline_{metodo}_final"
estado_principal: {defecto: best, dfr: dfr_best}
estados_sensibilidad: [last, ema]        # V2.8, punto 4 (limitado por la enmienda que corresponda a M4)
detector:
  C: 0.05
  caracteristicas: pooled
  tta: "espejo"                          # m9: fijado el 17-11-2026 (docs/08, enmiendas E3 y E8): promediado de espejo, como los métodos
  semilla_muestra_ajuste: 20261113
  n_ajuste: 6000
margen_ni: 0.02
margen_ni_sensibilidad: 0.01             # M3: sensibilidad registrada
B: 2000
semilla_bootstrap: 2026
troncos:
  D_IN: din_imagenet
  D_ERM: "baseline_erm_final_seed{semilla}_best"
  D_MASK: "baseline_erm_mascara_final_seed{semilla}_best"
  D_RES: [expl_erm_reserva_seed42_best, expl_erm_reserva_seed123_best, expl_erm_reserva20_seed42_best, expl_erm_reserva20_seed123_best]
conjuntos:
  validacion: {confirmatorio: val_robust, comparable_dfr: val_robust_sel, por_coleccion: val}
  test: {confirmatorio: test_bimcv, comparable_dfr: test_bimcv, por_coleccion: test}
  externo: test_covidgr
tablas:
  T-C1-1: "C1-i, AUC de los detectores (D_IN, D_ERM, D_RES, D_MASK) con IC95 y estratos AP y PA -> detectores.csv"
  T-C1-2: "C1-i, F-C1: D_IN frente a los doce métodos, no inferioridad 0.02 con Holm; sensibilidad 0.01 -> f_c1.csv"
  T-C1-3: "C1-i, F-C1b: D_ERM emparejado por semilla frente a los doce métodos -> f_c1b.csv"
  T-C1-4: "C1-ii, contrastes del reservado y transferencia -> c1_ii_reservado.csv"
  T-C1-5: "C1-iii, AUC por colección de cada método y referencia, y contrastes resumen (a) y (b) -> c1_iii_por_coleccion.csv, c1_iii_resumen.csv"
  T-C1-6: "C1-iv, clasificador de solo adquisición, variantes (a) y (b) y diferencia frente a ERM -> c1_iv_adquisicion.csv"
  T-C1-7: "C1-v, ERM con máscara frente a ERM y detector sobre el tronco enmascarado -> c1_v_mascara.csv"
  T-C1-8: "C1-vi, COVIDGR: AUC, sensibilidad, especificidad, caída y sensibilidad por gravedad -> c1_vi_covidgr.csv, c1_vi_gravedad.csv"
  T-C1-9: "C1-vii, estratos AP y PA de C1-i y C1-iii y clasificador de solo proyección -> c1_vii_estratos.csv"

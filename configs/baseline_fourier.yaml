# Línea base fourier: Mezcla de amplitud de Fourier entre fuentes (FACT sin profesor). Referencia: xu2021fourier. Estado: implementado.
# Deriva de configs/baseline_base.yaml (y esta de configs/nuevo_base.yaml): partición limpia, canal homogeneo con la
# caché común con máscaras (data/cache_m), ConvNeXt-Tiny ImageNet con la cabeza del artículo 1, selección y
# comparación en val_robust_sel, mismo presupuesto. Test BLOQUEADO en piloto y búsqueda; para los experimentos
# finales, ver docs/06_lineas_base.md, Section 4 (protocol.congelado).
# Lanzar: python -m src.baselines.run --config configs/baseline_fourier.yaml --seed 42 [--trial T]
base: baseline_base.yaml
experiment: baseline_fourier
baseline:
  method: fourier
  params: {}            # valores por defecto del registro: {'eta': 1.0, 'ratio': 1.0, 'cons_weight': 2.0, 'T': 10.0}

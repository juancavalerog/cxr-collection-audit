# Método erm_mascara en el benchmark B2. Protocolo común de configs/baseline_erm_mascara.yaml más la capa configs/b2_base.yaml.
# Lanzar (lo hacen scripts/jobs/make_jobs_b2.py): python -m src.baselines.run --config configs/b2_erm_mascara.yaml --seed <S>
#   [--trial T] --experimento <nombre> --set data.bench=<manifiesto de la semilla S>
base: [baseline_erm_mascara.yaml, b2_base.yaml]
experiment: b2_erm_mascara
baseline:
  method: erm_mascara
  params: {mask_dir: data/masks/bench_b2/homogeneo_224}

# Línea base erm_cuotas: ERM con el muestreador de cuotas de CSD-Net. Referencia: idrissi2022simple. Estado: implementado.
# Deriva de configs/baseline_base.yaml (y esta de configs/nuevo_base.yaml): partición limpia, canal homogeneo con la
# caché común con máscaras (data/cache_m), ConvNeXt-Tiny ImageNet con la cabeza del artículo 1, selección y
# comparación en val_robust_sel, mismo presupuesto. Test BLOQUEADO en piloto y búsqueda; para los experimentos
# finales, ver docs/06_lineas_base.md, Section 4 (protocol.congelado).
# Control del muestreador: mismos lotes que CSD-Net (64 imágenes, 2 por fuente y 4 por clase en cada fuente con las
# dos clases), sin intercambio ni arquitectura propia. Mismo número de imágenes por época que las demás líneas base.
# Lanzar: python -m src.baselines.run --config configs/baseline_erm_cuotas.yaml --seed 42 [--trial T]
base: baseline_base.yaml
experiment: baseline_erm_cuotas
train: {batch_size: 64}
baseline:
  method: erm_cuotas
  params: {}            # valores por defecto del registro: {min_per_source: 2, min_per_class_mixed: 4}
